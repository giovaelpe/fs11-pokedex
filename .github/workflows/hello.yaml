name: Hello World

on:
    push:
        branches:
            - main
    pull_request:
        branches: [main]
        types: [opened, synchronize]

jobs: 
    hello_world_job:
        runs-on: ubuntu-latest
        steps:
          - name: Say hello
            run: echo "Hello World!"
          - name: Run date
            run: date
          - name: Run ls -l
            run: ls -l
          - name: Testing skip
            env:
              MESSAGE : ${{toJson(github.event.commits.*.message)}}
            run: echo $MESSAGE